name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Auth private GitHub deps
        run: git config --global url."https://x-access-token:${{ secrets.AI_ENG_KIT_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - name: Install and verify
        run: |
          pnpm install
          pnpm run typecheck
          pnpm test
          pnpm run verify-notes
