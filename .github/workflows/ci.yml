name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout aitopo
        uses: actions/checkout@v4
        with:
          path: aitopo
      - name: Checkout ai-eng-kit
        uses: actions/checkout@v4
        with:
          repository: NeuraVoxel/ai-eng-kit
          path: ai-eng-kit
          # Same-org private sibling; set AI_ENG_KIT_TOKEN if default GITHUB_TOKEN cannot read the kit.
          token: ${{ secrets.AI_ENG_KIT_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: aitopo/pnpm-lock.yaml
      - name: Install and verify
        working-directory: aitopo
        run: |
          pnpm install
          pnpm run typecheck
          pnpm test
          pnpm run verify-notes
