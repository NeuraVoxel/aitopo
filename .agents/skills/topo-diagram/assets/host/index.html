<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>topo-diagram sample</title>
  <style>
    :root {
      --paper: #f5f5f5;
      --ink: #2d3142;
      --accent: #bf4520;
      --muted: #6b7280;
      --chrome: #e8e8e8;
      --node-fill: #ffffff;
      --font-sans: "IBM Plex Sans", "Source Sans 3", system-ui, sans-serif;
      --font-serif: "IBM Plex Sans", "Source Sans 3", system-ui, sans-serif;
      --font-mono: ui-monospace, "SFMono-Regular", Menlo, monospace;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: var(--font-sans);
      background: var(--paper);
      color: var(--ink);
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100%;
    }
    .topbar {
      flex: 0 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 0.75rem 1.25rem;
      padding: 1.25rem 1.5rem 0.85rem;
      background: var(--paper);
    }
    .topbar-titles {
      flex: 1 1 14rem;
      min-width: 0;
    }
    .eyebrow {
      margin: 0 0 0.35rem;
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .topbar-titles h1 {
      margin: 0;
      font-family: var(--font-serif);
      font-size: clamp(1.25rem, 1.5vw + 0.85rem, 1.75rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.2;
      color: var(--ink);
    }
    .legend {
      flex: 1 1 18rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 0.55rem 0.9rem;
      padding-top: 0.15rem;
      min-width: 0;
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--muted);
      white-space: nowrap;
    }
    .swatch {
      width: 0.85rem;
      height: 0.65rem;
      border-radius: 2px;
      flex: 0 0 auto;
    }
    .swatch-focal {
      background: rgba(191, 69, 32, 0.08);
      border: 1px solid var(--accent);
    }
    .swatch-default {
      background: var(--node-fill);
      border: 1px solid var(--ink);
    }
    .swatch-muted {
      background: rgba(45, 49, 66, 0.05);
      border: 1px solid var(--muted);
    }
    .swatch-line {
      width: 1.4rem;
      height: 0;
      border-radius: 0;
      background: transparent;
      border: 0;
      border-top: 2px solid var(--ink);
    }
    .swatch-line-accent { border-top-color: var(--accent); }
    .swatch-line-dashed {
      border-top-style: dashed;
      border-top-width: 1.5px;
      border-top-color: var(--muted);
    }
    .toolbar {
      position: relative;
      flex: 0 0 auto;
      margin-left: 0.25rem;
    }
    .toolbar-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2rem;
      height: 2rem;
      padding: 0;
      border: 1px solid var(--chrome);
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      border-radius: 2px;
      box-shadow: 0 1px 2px rgba(45, 49, 66, 0.06);
      font: inherit;
      font-size: 1.15rem;
      line-height: 1;
      letter-spacing: 0.05em;
    }
    .toolbar-toggle:hover,
    .toolbar.is-open .toolbar-toggle {
      border-color: var(--ink);
    }
    .toolbar-menu {
      display: none;
      position: absolute;
      top: calc(100% + 0.35rem);
      right: 0;
      z-index: 20;
      min-width: 11.5rem;
      margin: 0;
      padding: 0.35rem 0;
      list-style: none;
      border: 1px solid var(--chrome);
      background: #fff;
      border-radius: 2px;
      box-shadow: 0 4px 14px rgba(45, 49, 66, 0.12);
    }
    .toolbar.is-open .toolbar-menu { display: block; }
    .toolbar-menu li { margin: 0; }
    .toolbar-menu button {
      display: block;
      width: 100%;
      margin: 0;
      padding: 0.45rem 0.85rem;
      border: 0;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 0.8rem;
      text-align: left;
      cursor: pointer;
    }
    .toolbar-menu button:hover,
    .toolbar-menu button:focus-visible {
      background: rgba(45, 49, 66, 0.06);
      outline: none;
    }
    .toolbar-hint {
      margin: 0.25rem 0 0;
      padding: 0.4rem 0.85rem 0.35rem;
      border-top: 1px solid var(--chrome);
      font-size: 0.65rem;
      line-height: 1.35;
      color: var(--muted);
    }
    #canvas {
      position: relative;
      flex: 1 1 auto;
      width: 100%;
      min-height: 0;
      background: var(--paper);
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-titles">
      <p class="eyebrow" id="page-eyebrow">Topology</p>
      <h1 id="page-title">topo-diagram sample</h1>
    </div>
    <div class="legend" id="legend" aria-label="Legend">
      <span class="legend-item"><span class="swatch swatch-focal"></span>Focal</span>
      <span class="legend-item"><span class="swatch swatch-default"></span>Default</span>
      <span class="legend-item"><span class="swatch swatch-muted"></span>Muted</span>
      <span class="legend-item"><span class="swatch swatch-line swatch-line-accent"></span>Accent flow</span>
      <span class="legend-item"><span class="swatch swatch-line swatch-line-dashed"></span>Async / dep</span>
    </div>
    <div class="toolbar" id="toolbar">
      <button
        type="button"
        class="toolbar-toggle"
        id="btn-toolbar-toggle"
        aria-expanded="false"
        aria-haspopup="menu"
        aria-controls="toolbar-menu"
        aria-label="Menu"
        title="Menu"
      >⋯</button>
      <ul class="toolbar-menu" id="toolbar-menu" role="menu" hidden>
        <li role="none"><button type="button" role="menuitem" id="btn-fit">Fit view</button></li>
        <li role="none"><button type="button" role="menuitem" id="btn-expand">Expand all</button></li>
        <li role="none"><button type="button" role="menuitem" id="btn-collapse">Collapse all</button></li>
        <li role="none"><button type="button" role="menuitem" id="btn-copy">Copy JSON</button></li>
        <li role="none"><button type="button" role="menuitem" id="btn-download">Download JSON</button></li>
        <li role="none"><button type="button" role="menuitem" id="btn-reset">Reset</button></li>
        <li>
          <p class="toolbar-hint">
            Pan/zoom · drag · Alt+drag link · double-click group/portal · empty to exit
          </p>
        </li>
      </ul>
    </div>
  </header>
  <div id="canvas"></div>
