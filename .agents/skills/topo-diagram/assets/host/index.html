<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>topo-diagram sample</title>
  <style>
    :root {
      --paper: #f5f5f5;
      --ink: #2d3142;
      --accent: #bf4520;
      --muted: #6b7280;
      --chrome: #e8e8e8;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: "IBM Plex Sans", "Source Sans 3", system-ui, sans-serif;
      background: var(--paper);
      color: var(--ink);
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem 0.75rem;
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid var(--chrome);
      background: #fff;
    }
    header h1 {
      font-size: 0.95rem;
      font-weight: 600;
      margin: 0 0.5rem 0 0;
    }
    header button {
      font: inherit;
      font-size: 0.8rem;
      padding: 0.35rem 0.65rem;
      border: 1px solid var(--chrome);
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      border-radius: 2px;
    }
    header button:hover { border-color: var(--ink); }
    .hint {
      flex: 1 1 12rem;
      font-size: 0.75rem;
      color: var(--muted);
    }
    #canvas {
      position: absolute;
      inset: 2.75rem 0 0 0;
      width: 100%;
      background: var(--paper);
    }
  </style>
</head>
<body>
  <header>
    <h1>topo-diagram sample</h1>
    <button type="button" id="btn-expand">Expand all</button>
    <button type="button" id="btn-collapse">Collapse all</button>
    <button type="button" id="btn-copy">Copy JSON</button>
    <button type="button" id="btn-download">Download JSON</button>
    <button type="button" id="btn-reset">Reset</button>
    <p class="hint">
      Pan/zoom · drag nodes · Alt+drag to link · double-click group to toggle ·
      double-click portal to enter · double-click empty to exit
    </p>
  </header>
  <div id="canvas"></div>

  <script type="application/json" id="diagram-data">
{
  "version": 1,
  "meta": {
    "title": "topo-diagram golden sample",
    "kind": "topology"
  },
  "nodes": [
    { "id": "a1", "type": "component", "label": "Ingest", "x": 80, "y": 100, "groupId": "alpha" },
    { "id": "a2", "type": "component", "label": "Normalize", "x": 220, "y": 100, "groupId": "alpha" },
    { "id": "b1", "type": "component", "label": "Index", "x": 420, "y": 100, "groupId": "beta" },
    { "id": "b2", "type": "component", "label": "Query", "x": 560, "y": 100, "groupId": "beta" },
    { "id": "gateway", "type": "component", "label": "Gateway", "x": 300, "y": 280 },
    {
      "id": "portal-detail",
      "type": "portal",
      "label": "Detail",
      "x": 520,
      "y": 280,
      "networkId": "detail"
    }
  ],
  "edges": [
    { "id": "e-a", "from": "a1", "to": "a2", "kind": "flow", "label": "pipeline" },
    { "id": "cross", "from": "a2", "to": "b1", "kind": "flow", "label": "hand-off" },
    { "id": "e-b", "from": "b1", "to": "b2", "kind": "flow" },
    { "id": "e-gw", "from": "gateway", "to": "a1", "kind": "flow" },
    { "id": "e-portal", "from": "b2", "to": "portal-detail", "kind": "dep" }
  ],
  "groups": [
    {
      "id": "alpha",
      "label": "Ingest band",
      "memberIds": ["a1", "a2"],
      "expanded": true,
      "x": 40,
      "y": 48
    },
    {
      "id": "beta",
      "label": "Serve band",
      "memberIds": ["b1", "b2"],
      "expanded": true,
      "x": 380,
      "y": 48
    }
  ],
  "networks": {
    "detail": {
      "version": 1,
      "meta": { "title": "Detail subnetwork" },
      "nodes": [
        { "id": "d1", "type": "component", "label": "Shard A", "x": 80, "y": 80 },
        { "id": "d2", "type": "component", "label": "Shard B", "x": 240, "y": 80 }
      ],
      "edges": [
        { "id": "d-e", "from": "d1", "to": "d2", "kind": "flow", "label": "replicate" }
      ]
    }
  },
  "viewport": { "x": 0, "y": 0, "zoom": 1 }
}
  </script>
  <script src="../aitopo.iife.js"></script>
  <script src="./host.js"></script>
  <script>
    TopoDiagramHost.bootFromPage(document)
  </script>
</body>
</html>
