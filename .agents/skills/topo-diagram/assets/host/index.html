<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>topo-diagram sample</title>
  <style>
    :root {
      --paper: #f5f5f5;
      --ink: #2d3142;
      --accent: #bf4520;
      --muted: #6b7280;
      --chrome: #e8e8e8;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: "IBM Plex Sans", "Source Sans 3", system-ui, sans-serif;
      background: var(--paper);
      color: var(--ink);
    }
    #canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      background: var(--paper);
    }
    .toolbar {
      position: absolute;
      top: 0.75rem;
      right: 0.75rem;
      z-index: 10;
    }
    .toolbar-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2rem;
      height: 2rem;
      padding: 0;
      border: 1px solid var(--chrome);
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      border-radius: 2px;
      box-shadow: 0 1px 2px rgba(45, 49, 66, 0.06);
      font: inherit;
      font-size: 1.15rem;
      line-height: 1;
      letter-spacing: 0.05em;
    }
    .toolbar-toggle:hover,
    .toolbar.is-open .toolbar-toggle {
      border-color: var(--ink);
    }
    .toolbar-menu {
      display: none;
      position: absolute;
      top: calc(100% + 0.35rem);
      right: 0;
      min-width: 11.5rem;
      margin: 0;
      padding: 0.35rem 0;
      list-style: none;
      border: 1px solid var(--chrome);
      background: #fff;
      border-radius: 2px;
      box-shadow: 0 4px 14px rgba(45, 49, 66, 0.12);
    }
    .toolbar.is-open .toolbar-menu { display: block; }
    .toolbar-menu li { margin: 0; }
    .toolbar-menu button {
      display: block;
      width: 100%;
      margin: 0;
      padding: 0.45rem 0.85rem;
      border: 0;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 0.8rem;
      text-align: left;
      cursor: pointer;
    }
    .toolbar-menu button:hover,
    .toolbar-menu button:focus-visible {
      background: rgba(45, 49, 66, 0.06);
      outline: none;
    }
    .toolbar-title {
      padding: 0.35rem 0.85rem 0.45rem;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--muted);
      line-height: 1.3;
      border-bottom: 1px solid var(--chrome);
      margin-bottom: 0.25rem;
    }
    .toolbar-hint {
      margin: 0.25rem 0 0;
      padding: 0.4rem 0.85rem 0.35rem;
      border-top: 1px solid var(--chrome);
      font-size: 0.65rem;
      line-height: 1.35;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div id="canvas"></div>
  <div class="toolbar" id="toolbar">
    <button
      type="button"
      class="toolbar-toggle"
      id="btn-toolbar-toggle"
      aria-expanded="false"
      aria-haspopup="menu"
      aria-controls="toolbar-menu"
      aria-label="Menu"
      title="Menu"
    >⋯</button>
    <ul class="toolbar-menu" id="toolbar-menu" role="menu" hidden>
      <li class="toolbar-title" id="toolbar-title">topo-diagram sample</li>
      <li role="none"><button type="button" role="menuitem" id="btn-expand">Expand all</button></li>
      <li role="none"><button type="button" role="menuitem" id="btn-collapse">Collapse all</button></li>
      <li role="none"><button type="button" role="menuitem" id="btn-copy">Copy JSON</button></li>
      <li role="none"><button type="button" role="menuitem" id="btn-download">Download JSON</button></li>
      <li role="none"><button type="button" role="menuitem" id="btn-reset">Reset</button></li>
      <li>
        <p class="toolbar-hint">
          Pan/zoom · drag · Alt+drag link · double-click group/portal · empty to exit
        </p>
      </li>
    </ul>
  </div>

  <script type="application/json" id="diagram-data">
{
  "version": 1,
  "meta": {
    "title": "topo-diagram golden sample",
    "kind": "topology"
  },
  "nodes": [
    { "id": "a1", "type": "component", "label": "Ingest", "x": 80, "y": 100, "groupId": "alpha" },
    { "id": "a2", "type": "component", "label": "Normalize", "x": 220, "y": 100, "groupId": "alpha" },
    { "id": "b1", "type": "component", "label": "Index", "x": 420, "y": 100, "groupId": "beta" },
    { "id": "b2", "type": "component", "label": "Query", "x": 560, "y": 100, "groupId": "beta" },
    { "id": "gateway", "type": "component", "label": "Gateway", "x": 300, "y": 280 },
    {
      "id": "portal-detail",
      "type": "portal",
      "label": "Detail",
      "x": 520,
      "y": 280,
      "networkId": "detail"
    }
  ],
  "edges": [
    { "id": "e-a", "from": "a1", "to": "a2", "kind": "flow", "label": "pipeline" },
    { "id": "cross", "from": "a2", "to": "b1", "kind": "flow", "label": "hand-off" },
    { "id": "e-b", "from": "b1", "to": "b2", "kind": "flow" },
    { "id": "e-gw", "from": "gateway", "to": "a1", "kind": "flow" },
    { "id": "e-portal", "from": "b2", "to": "portal-detail", "kind": "dep" }
  ],
  "groups": [
    {
      "id": "alpha",
      "label": "Ingest band",
      "memberIds": ["a1", "a2"],
      "expanded": true,
      "x": 40,
      "y": 48
    },
    {
      "id": "beta",
      "label": "Serve band",
      "memberIds": ["b1", "b2"],
      "expanded": true,
      "x": 380,
      "y": 48
    }
  ],
  "networks": {
    "detail": {
      "version": 1,
      "meta": { "title": "Detail subnetwork" },
      "nodes": [
        { "id": "d1", "type": "component", "label": "Shard A", "x": 80, "y": 80 },
        { "id": "d2", "type": "component", "label": "Shard B", "x": 240, "y": 80 }
      ],
      "edges": [
        { "id": "d-e", "from": "d1", "to": "d2", "kind": "flow", "label": "replicate" }
      ]
    }
  },
  "viewport": { "x": 0, "y": 0, "zoom": 1 }
}
  </script>
  <script src="../aitopo.iife.js"></script>
  <script src="./host.js"></script>
  <script>
    TopoDiagramHost.bootFromPage(document)
  </script>
</body>
</html>
