<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>topo-diagram svg track — quadrant example</title>
  <style>
    :root {
      --paper: #f5f5f5;
      --ink: #2d3142;
      --accent: #bf4520;
      --muted: #6b7280;
    }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "IBM Plex Sans", "Source Sans 3", system-ui, sans-serif;
    }
    main { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.1rem; font-weight: 600; }
    p { color: var(--muted); font-size: 0.9rem; }
    svg { width: 100%; height: auto; background: #fff; border: 1px solid #e8e8e8; }
    .focal { fill: var(--accent); }
    .dot { fill: var(--ink); }
    .axis { stroke: var(--ink); stroke-width: 1.5; }
    .label { fill: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>Impact × Effort</h1>
    <p>SVG track example — same style-guide tokens as topo host pages.</p>
    <svg viewBox="0 0 400 320" role="img" aria-label="Quadrant chart">
      <line class="axis" x1="40" y1="280" x2="360" y2="280" />
      <line class="axis" x1="40" y1="280" x2="40" y2="40" />
      <line class="axis" x1="200" y1="280" x2="200" y2="40" stroke-dasharray="4 4" opacity="0.4" />
      <line class="axis" x1="40" y1="160" x2="360" y2="160" stroke-dasharray="4 4" opacity="0.4" />
      <text class="label" x="200" y="308" text-anchor="middle">Effort →</text>
      <text class="label" x="16" y="160" text-anchor="middle" transform="rotate(-90 16 160)">Impact →</text>
      <circle class="dot" cx="120" cy="220" r="6" />
      <circle class="focal" cx="280" cy="90" r="7" />
      <circle class="dot" cx="150" cy="100" r="6" />
      <circle class="dot" cx="300" cy="200" r="6" />
    </svg>
  </main>
</body>
</html>
